name: Run checks in dev

on:
  pull_request:
    branches:
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11' ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: | 
        python -m pip install -e .[dev]
    - name: Run linter checks
      run: flake8 . && interrogate --verbose .
    - name: Run tests and coverage
      run: coverage run -m unittest discover && coverage report
  docker_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: false
        load: true
        tags: aind-metadata-mapper:pr-test
    - name: Smoke test docker image
      run: |
        docker run --rm aind-metadata-mapper:pr-test cat /etc/os-release
        docker run --rm aind-metadata-mapper:pr-test git --version
        docker run --rm aind-metadata-mapper:pr-test python -c \
          "import aind_metadata_mapper; print(aind_metadata_mapper.__version__)"
        docker run --rm aind-metadata-mapper:pr-test aind-instrument --help
